<h2>Filter Panel v2 — Clear Exclusion Label on Allergens</h2>

<div style="background: #f1f5f9; padding: 16px; max-width: 420px; margin: 0 auto; font-family: system-ui;">

    <div style="flex: 1; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.04); border-radius: 12px; padding: 4px 10px;">
      <span style="opacity: 0.3; font-size: 14px;">🔍</span>
      <input placeholder="Search menu..." style="border: none; background: transparent; flex: 1; font-size: 13px; outline: none; padding: 5px 0;" />

        <label style="display: flex; align-items: center; gap: 5px; background: #f8fafc; border-radius: 10px; padding: 7px 10px; cursor: pointer; border: 1.5px solid transparent; font-size: 11px; font-weight: 600;">

        <label style="display: flex; align-items: center; gap: 5px; background: #f0fdf4; border-radius: 10px; padding: 7px 10px; cursor: pointer; border: 1.5px solid #22c55e; font-size: 11px; font-weight: 600; color: #166534;">
          🌱 Vegan <input type="checkbox" checked style="accent-color: #22c55e; margin-left: 2px;" />

        <label style="display: flex; align-items: center; gap: 5px; background: #f8fafc; border-radius: 10px; padding: 7px 10px; cursor: pointer; border: 1.5px solid transparent; font-size: 11px; font-weight: 600;">
          🆕 New <input type="checkbox" style="accent-color: #3b82f6; margin-left: 2px;" />
        </label>
        <label style="display: flex; align-items: center; gap: 5px; background: #f8fafc; border-radius: 10px; padding: 7px 10px; cursor: pointer; border: 1.5px solid transparent; font-size: 11px; font-weight: 600;">
          ⭐ Popular <input type="checkbox" style="accent-color: #3b82f6; margin-left: 2px;" />
        </label>
        <label style="display: flex; align-items: center; gap: 5px; background: #f8fafc; border-radius: 10px; padding: 7px 10px; cursor: pointer; border: 1.5px solid transparent; font-size: 11px; font-weight: 600;">

        </label>

        </button>
        <button style="padding: 7px 12px; border-radius: 100px; border: 1.5px solid #ef4444; background: #fef2f2; color: #991b1b; font-size: 11px; font-weight: 600; cursor: pointer;">
          🥜 Nuts <span style="margin-left: 3px; font-size: 10px;">✕</span>
        </button>
        <button style="padding: 7px 12px; border-radius: 100px; border: 1.5px solid #e2e8f0; background: white; font-size: 11px; font-weight: 600; cursor: pointer;">
          🐟 Fish
        </button>
        <button style="padding: 7px 12px; border-radius: 100px; border: 1.5px solid #e2e8f0; background: white; font-size: 11px; font-weight: 600; cursor: pointer;">

        </button>
        <button style="padding: 7px 12px; border-radius: 100px; border: 1.5px solid #e2e8f0; background: white; font-size: 11px; font-weight: 600; cursor: pointer;">

        <button style="padding: 7px 12px; border-radius: 100px; border: 1.5px solid #e2e8f0; background: white; font-size: 11px; font-weight: 600; cursor: pointer;">

    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; opacity: 0.5;">
      <span style="width: 10px; height: 10px; border-radius: 3px; background: #ef4444;"></span> = Exclude / Hide
    </div>

</div>
