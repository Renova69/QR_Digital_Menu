name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
  # schema.prisma declares `directUrl = env("DIRECT_URL")` for the session-mode
  # endpoint migrations need. Without it `prisma migrate deploy` fails
  # validation (P1012) before it opens a connection. The CI Postgres service
  # has no pooler in front of it, so both point at the same database.
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
  CONCURRENCY_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
  JWT_SECRET: ci-jwt-secret-not-for-production
  FRONTEND_URL: http://localhost:3001
  NODE_ENV: test
  COOKIE_SAMESITE: lax

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Fails fast, before the expensive install/test steps, because a leaked
      # credential means "rotate it now", not "wait 25 minutes for the suite".
      # Pinned + checksum-verified rather than an action: this downloads an
      # executable, and an unpinned one is a supply-chain hole in the very step
      # that exists to close supply-chain holes.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSL -o "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          # `dir` scans the working tree, which is what "is a secret in the code
          # we are about to ship" actually means. Full-history scanning is a
          # separate, deliberate exercise -- this repo has a known rotated
          # credential in its log, and failing every PR over a dead value would
          # get the whole gate switched off.
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Pull request self-review gate
        run: node scripts/check-pr-review.js

      - name: Repository policy tests
        run: npm run test:repository-policy

      - name: Reject destructive migration SQL
        run: node scripts/check-migration-safety.js apps/backend/prisma/migrations

      - name: Validate deployment script syntax
        shell: pwsh
        run: |
          $scripts = @(
            './deploy.ps1',
            './ops/db-backup/setup.ps1',
            './ops/staging/deploy-staging.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "$script contains PowerShell parse errors"
            }
          }

      # Cloud Build submits apps/backend as its Docker context, so the nested
      # lockfile is a separate deployment contract from the root workspace
      # lockfile. Validate that exact npm ci boundary before installing the
      # workspace tree because npm ci clears this nested node_modules directory.
      - name: Validate backend Docker lockfile
        working-directory: apps/backend
        run: npm ci --package-lock-only --ignore-scripts --workspaces=false --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security gate
        run: npm run audit:production

      - name: Database safety guard tests
        run: |
          npm run test:database-safety
          python3 -m unittest ops/db-backup/backup_safety_test.py

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Verify published OpenAPI contract
        run: |
          npm run openapi:generate
          git diff --exit-code -- apps/docs/static/api/openapi.json

      - name: Run Database Migrations
        working-directory: apps/backend
        run: npm run migrate:deploy

      - name: Verify migrated database matches Prisma schema
        working-directory: apps/backend
        run: >-
          npx prisma migrate diff
          --from-schema-datasource=prisma/schema.prisma
          --to-schema-datamodel=prisma/schema.prisma
          --exit-code

      - name: Verify migration integrity and production data blockers
        working-directory: apps/backend
        run: npx ts-node scripts/verify-preproduction-readonly.ts

      - name: Prisma raw-query guard
        run: npm run guard:prisma-raw-void

      - name: Backend lint
        working-directory: apps/backend
        run: npm run lint

      - name: Frontend lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Backend unit tests
        working-directory: apps/backend
        run: npm run test:cov -- --reporters=default --ci

      - name: Backend end-to-end tests
        working-directory: apps/backend
        run: npx jest --config ./test/jest-e2e.json --runInBand --ci

      - name: Frontend type-check
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm run test:cov

      - name: Printer-agent type-check
        working-directory: apps/printer-agent
        run: npm run typecheck

      - name: Printer-agent lint
        working-directory: apps/printer-agent
        run: npm run lint

      - name: Printer-agent tests
        working-directory: apps/printer-agent
        run: npm run test:cov

      - name: Install Chromium for browser smoke tests
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: apps/frontend
        run: npm run test:e2e

      - name: Build applications
        run: npx turbo run build
