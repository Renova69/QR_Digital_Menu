name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
  CONCURRENCY_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
  JWT_SECRET: ci-jwt-secret-not-for-production
  FRONTEND_URL: http://localhost:3001
  NODE_ENV: test
  COOKIE_SAMESITE: lax

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Run Database Migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Prisma raw-query guard
        run: npm run guard:prisma-raw-void

      - name: Backend lint
        working-directory: apps/backend
        run: npm run lint

      - name: Frontend lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Backend unit tests
        working-directory: apps/backend
        run: npm run test:cov -- --reporters=default --ci

      - name: Backend end-to-end tests
        working-directory: apps/backend
        run: npx jest --config ./test/jest-e2e.json --runInBand --ci

      - name: Frontend type-check
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm run test:cov

      - name: Printer-agent type-check
        working-directory: apps/printer-agent
        run: npm run typecheck

      - name: Printer-agent lint
        working-directory: apps/printer-agent
        run: npm run lint

      - name: Printer-agent tests
        working-directory: apps/printer-agent
        run: npm run test:cov

      - name: Install Chromium for browser smoke tests
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: apps/frontend
        run: npm run test:e2e

      - name: Build applications
        run: npx turbo run build
