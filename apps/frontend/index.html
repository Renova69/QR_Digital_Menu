    <meta name="theme-color" content="#0D1B2A" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <title>Renova — Digital Menu Platform</title>
    <!-- Blocking theme script: must run before React mounts to prevent FOUC.
         Checks the global 'theme' key first; falls back to per-restaurant
         'theme-{restaurantId}' for public menu pages so returning visitors
         never see a flash of light before React hydrates. -->
    <script>
      (function () {
        try {
          var t;
          var m = location.pathname.match(/\/menu\/public\/([^/?#]+)/);
          if (m) {
            // Public menu: per-restaurant preference takes priority over global
            t = localStorage.getItem("theme-" + m[1]);
          }
          if (!t) t = localStorage.getItem("theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
